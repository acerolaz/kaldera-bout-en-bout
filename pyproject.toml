[project]
name = "kaldera"
version = "0.3.0"
description = "Traitement des demandes de remboursement d'assurance par une équipe d'agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "httpx>=0.28,<0.30",
    "pydantic>=2.7,<3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-azure-ai>=0.1,<0.2",
    "langgraph>=0.2,<0.3",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaldera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: exige PostgreSQL (make test-integration)"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
