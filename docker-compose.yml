services:
  partenaire:
    build: ./external_agent
    environment:
      PARTENAIRE_JETON: ${PARTENAIRE_JETON:-jeton-de-demo}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/_sim/etat')\""]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16
    profiles: ["integration"]
    environment:
      POSTGRES_USER: kaldera
      POSTGRES_PASSWORD: kaldera
      POSTGRES_DB: kaldera_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaldera -d kaldera_test"]
      interval: 2s
      timeout: 3s
      retries: 15
